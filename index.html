<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>Savdo Hisobi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f4;--card:#fff;--ink:#14231f;--mut:#667571;--line:#e1e7e4;
  --pri:#0f766e;--pri2:#0b5d56;--pri-soft:#e1f3f0;
  --up:#15803d;--down:#c2271f;--warn:#b45309;--warn-soft:#fef3c7;
  --key:#f0f3f2;--op:#d8ece9;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1614;--card:#16211e;--ink:#e8f0ed;--mut:#8da39d;--line:#263430;
  --pri:#2bb3a5;--pri2:#1f8f84;--pri-soft:#173a36;--up:#4ade80;--down:#f87171;--warn:#fbbf24;--warn-soft:#3b2f10;--key:#1e2c28;--op:#1b3a36}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;font-weight:700}
header small{opacity:.85}
main{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:900px;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
@media (min-width:860px){
  #app{flex-direction:row-reverse}
  #app>div.col{display:flex;flex-direction:column;flex:1;min-width:0}
  nav{flex-direction:column;width:96px;border-top:0;border-right:1px solid var(--line);padding-top:12px}
  nav button{padding:16px 2px;font-size:12px;flex:none}
}
.col{display:contents}
@media (min-width:860px){.col{display:flex}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .l{font-size:12px;color:var(--mut);margin-bottom:4px}
.stat .v{font-size:19px;font-weight:700;word-break:break-word}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}
button.btn{border:0;border-radius:11px;padding:11px 16px;font-size:15px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
button.btn:active{background:var(--pri2)}
button.btn.sec{background:var(--pri-soft);color:var(--pri)}
button.btn.red{background:#fde8e6;color:var(--down)}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button.btn.full{width:100%}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.auto{flex:none}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list>div.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:default}
.list>div.item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .s{font-size:12px;color:var(--mut)}
.item.click{cursor:pointer}
.amt{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--mut);font-size:14px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
tr.be td{background:var(--pri-soft);font-weight:700}
.scroll{overflow-x:auto}
/* calculator */
.calc{max-width:420px;margin:0 auto}
.disp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:10px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end}
.disp .ex{color:var(--mut);font-size:17px;min-height:24px;word-break:break-all}
.disp .rs{font-size:38px;font-weight:700;word-break:break-all;line-height:1.15}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:0;background:var(--key);color:var(--ink);font-size:23px;font-weight:600;border-radius:14px;padding:0;height:clamp(52px,8.5vh,66px);cursor:pointer}
.keys button:active{filter:brightness(.92)}
.keys button.op{background:var(--op);color:var(--pri)}
.keys button.eq{background:var(--pri);color:#fff}
.keys button.cl{color:var(--down)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:19px}
.big{font-size:30px;font-weight:800;color:var(--pri);margin:4px 0 8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#14231f;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.badge.r{background:#fde8e6;color:var(--down)}.badge.g{background:#dcfce7;color:var(--up)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.chart{width:100%;height:190px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px}

/* ===== Yangi dizayn ===== */
:root{--sh:0 1px 2px rgba(15,60,55,.06),0 8px 22px rgba(15,60,55,.07);--rad:18px}
header{background:linear-gradient(135deg,#0f766e 0%,#0b5d56 100%);padding-bottom:14px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(11,93,86,.25);position:relative;z-index:2}
header h1{font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
header h1:before{content:"";width:26px;height:26px;background:url(icon-192.png) center/cover;border-radius:7px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
main{padding-top:16px}
.card,.stat{border-radius:var(--rad);box-shadow:var(--sh);border-color:transparent}
.card h3{font-size:16px}
.view-in{animation:vin .28s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav{box-shadow:0 -4px 18px rgba(0,0,0,.06);border-top:0}
nav button{position:relative;transition:color .2s}
nav button.on:before{content:"";position:absolute;top:5px;width:48px;height:30px;border-radius:15px;background:var(--pri-soft)}
nav button svg,nav button span{position:relative}
nav button.on svg{stroke-width:2.3}
button.btn{border-radius:14px;transition:transform .08s,filter .15s;box-shadow:0 2px 6px rgba(15,118,110,.22)}
button.btn:active{transform:scale(.97)}
button.btn.sec,button.btn.red{box-shadow:none}
.hero{background:linear-gradient(135deg,#0f766e,#0b5d56 60%,#0a4a45);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 10px 26px rgba(11,93,86,.3);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero .hl{font-size:13px;opacity:.88}
.hero .hv{font-size:34px;font-weight:800;margin:4px 0 10px;letter-spacing:-.5px;word-break:break-word}
.hero .hrow{display:flex;gap:8px}
.hero .hc{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 11px}
.hero .hc b{display:block;font-size:16px;word-break:break-word}
.hero .hc span{font-size:11.5px;opacity:.85}
.hbtn{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer;position:relative;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;font-weight:700;color:var(--pri);font-size:14px;cursor:pointer}
.chips button:active{background:var(--pri-soft)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:16px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.who>div:last-child{min-width:0}
.abtn{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:14px;padding:11px 16px;font-size:15px;font-weight:700;background:var(--pri-soft);color:var(--pri);flex:1}
.list>div.item.click:active{background:var(--pri-soft)}
.empty{font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <header><h1 id="shopName">Savdo Hisobi</h1><small><span id="cloudSt"></span> <span id="todayLbl"></span></small></header>
    <main><div class="wrap" id="view"></div></main>
  </div>
  <nav id="nav"></nav>
</div>
<div id="modal"></div>

<script>
"use strict";
/* ============ Ma'lumotlar ============ */
const KEY = "savdo_hisobi_v1";
let DB;
function load(raw){
  DB = (raw && typeof raw==="object") ? raw : {};
  DB.customers = DB.customers || [];
  DB.sales = DB.sales || [];
  DB.capital = DB.capital || [];
  DB.trash = DB.trash || [];
  DB.stock = DB.stock || [];
  DB.miss = DB.miss || [];
  DB.settings = Object.assign({shop:"",margin:20}, DB.settings||{});
  if(!DB.settings.trialStart){ try{ DB.settings.trialStart = getLic().first; }catch(e){} }
}
function save(){ persistLocal(); if(typeof cloudPush==="function") cloudPush(); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ Yordamchilar ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const MONTHS = ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
const fmtDate = s => { const d=parseD(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear(); };
function num(x){ // 1 234 567,5
  x = Math.round((Number(x)||0)*100)/100;
  const neg = x<0; x=Math.abs(x);
  let [i,f] = x.toString().split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"−":"")+i+(f?","+f:"");
}
const som = x => num(x)+" so'm";
const val = el => { const v = parseFloat(String(el.value).replace(/\s/g,"").replace(",",".")); return isNaN(v)?0:v; };
function toast(t){ const e=document.createElement("div"); e.className="toast"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2200); }
function saleProfit(s){
  if(s.cost!=null && s.cost!=="") return s.amount - s.cost;
  return s.amount * (DB.settings.margin||0)/100;
}

/* ============ Modal ============ */
function openModal(html, onMount){
  const m=$("#modal");
  m.innerHTML = '<div class="ov"><div class="sheet">'+html+'</div></div>';
  $(".ov",m).addEventListener("mousedown",e=>{ if(e.target.classList.contains("ov")) closeModal(); });
  onMount && onMount($(".sheet",m));
}
function closeModal(){ $("#modal").innerHTML=""; if(typeof needRender!=="undefined" && needRender) softRender(); }
function confirmBox(text, yes){
  openModal(`<h2>${esc(text)}</h2><div class="row" style="margin-top:16px"><button class="btn sec" id="n">Yo'q</button><button class="btn red" id="y">Ha, o'chirish</button></div>`,
    s=>{ $("#n",s).onclick=closeModal; $("#y",s).onclick=()=>{closeModal();yes();}; });
}


/* ============ Telefon xotirasi: IndexedDB (katta hajm uchun) ============ */
const IDB={db:null};
function idbOpen(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no idb"));const r=indexedDB.open("savdo_db",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"));});}
function idbGet(k){return new Promise((res,rej)=>{const t=IDB.db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=IDB.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
let pt=null;
function persistLocal(now){
  clearTimeout(pt);
  const run=()=>{
    const ls=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("Saqlashda xato! Telefon xotirasi to'lgan.");}};
    if(IDB.db){idbPut(KEY,DB).catch(ls);}else ls();
  };
  if(now)run();else pt=setTimeout(run,200);
}
window.addEventListener("pagehide",()=>persistLocal(true));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")persistLocal(true);});
async function boot(){
  try{IDB.db=await idbOpen();}catch(e){IDB.db=null;}
  let raw=null,fromLS=false;
  if(IDB.db){try{raw=await idbGet(KEY);}catch(e){}}
  if(!raw){try{const t=localStorage.getItem(KEY);if(t){raw=JSON.parse(t);fromLS=true;}}catch(e){}}
  load(raw);
  if(fromLS&&IDB.db){try{await idbPut(KEY,DB);localStorage.removeItem(KEY);}catch(e){}}
  CL.id=(()=>{try{return localStorage.getItem(CKEY)||null;}catch(e){return null;}})();
  if(CL.id){CL.synced=flat(DB);CL.lastFlat=flat(DB);}
  render();
  purgeTrash();
  autoSnap();
  maybeIntro();
  if(CL.id)cloudStart();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}

/* ============ Litsenziya (sinov + aktivatsiya) ============ */
const SALT="mmXTdPx2VWKjT2", TRIAL_DAYS=7;
const SELLER_CONTACT="+998 90 558 83 86";
const LKEY="savdo_lic_v1";
function hs(s){let a=0x811c9dc5;for(let i=0;i<s.length;i++){a^=s.charCodeAt(i);a=Math.imul(a,16777619)>>>0;}return a;}
const normName=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function mkCode(name){const n=normName(name);const a=hs(SALT+"|"+n).toString(36).padStart(7,"0"),b=hs(n+"|"+SALT+"|2").toString(36).padStart(7,"0");const c=(a+b).toUpperCase().slice(0,8);return c.slice(0,4)+"-"+c.slice(4);}
function getLic(){let L=null;try{L=JSON.parse(localStorage.getItem(LKEY));}catch(e){}if(!L||!L.first){L={first:Date.now()};try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}}return L;}
function licState(){const L=getLic(),S=DB.settings.license;const okc=x=>x&&x.name&&x.code&&mkCode(x.name)===x.code;
 if(okc(L))return{ok:true,active:true,name:L.name};if(okc(S))return{ok:true,active:true,name:S.name};
 const first=Math.min(L.first,DB.settings.trialStart||Infinity);const left=TRIAL_DAYS-Math.floor((Date.now()-first)/864e5);return{ok:left>0,active:false,left:Math.max(0,left)};}
function actHtml(){return `<label>Do'kon nomi (sotuvchi kodni shu nomga bergan)</label><input id="lnm" placeholder="Masalan: Bunyod savdo">
 <label>Aktivatsiya kodi</label><input id="lcd" placeholder="XXXX-XXXX" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:2px">
 <button class="btn full" id="lok" style="margin-top:14px">Faollashtirish</button>`;}
function bindAct(root){$("#lok",root).onclick=()=>{const nm=$("#lnm",root).value.trim(),cd=$("#lcd",root).value.trim().toUpperCase().replace(/\s/g,"");
 if(!nm||!cd){toast("Nom va kodni kiriting");return;}
 if(mkCode(nm)!==cd){toast("Kod yoki nom noto'g'ri");return;}
 const L=getLic();L.name=nm;L.code=cd;try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(e){}
 DB.settings.license={name:nm,code:cd};if(!DB.settings.shop)DB.settings.shop=nm;save();toast("Faollashtirildi ✓");render();};}
function renderLock(){$("#nav").style.display="none";$("#view").innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h3 style="font-size:19px">Sinov muddati tugadi</h3>
 <div class="mut" style="margin-bottom:6px">Davom etish uchun aktivatsiya kodi kerak. Ma'lumotlaringiz saqlanib turibdi — faollashtirgach hammasi qaytadi.</div>
 ${actHtml()}${SELLER_CONTACT?`<div class="note" style="margin-top:14px;margin-bottom:0">Kod olish uchun: <b>${esc(SELLER_CONTACT)}</b></div>`:""}</div>`;bindAct($("#view"));}

/* ============ Bulut (Firebase) — xodimlar uchun umumiy daftar ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBhP8FfoXZUxdDYc019xiwzKYUnOgcSUiw",
  authDomain: "savdo-hisobi-51f92.firebaseapp.com",
  projectId: "savdo-hisobi-51f92",
  storageBucket: "savdo-hisobi-51f92.firebasestorage.app",
  messagingSenderId: "852590572806",
  appId: "1:852590572806:web:99e5bd37bf92c1d48e5a87"
};
const FB_VER = "10.14.1", CKEY = "savdo_cloud_v1";
const COLS = ["customers","days","capital","trash","meta"];
const CL = {id:null,status:"off",ready:false,started:false,fb:null,authOk:false,unsubs:[],seen:{},synced:{},idx:{},lastFlat:{},lastSync:0,lastErr:""};
const clean = o => JSON.parse(JSON.stringify(o));
function sj(o){ if(o===null||typeof o!=="object") return JSON.stringify(o); if(Array.isArray(o)) return "["+o.map(sj).join(",")+"]"; return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+sj(o[k])).join(",")+"}"; }
const emptyFlat = () => ({});
// Bulutdagi tuzilma: customers/{id} (ichida tx xaritasi) · days/{sana} (ichida s xaritasi) · capital/{id} · meta/settings
function flat(d){
  const o={};
  d.customers.forEach(c=>{
    o["customers/"+c.id]=clean({id:c.id,name:c.name||"",phone:c.phone||"",note:c.note||""});
    (c.tx||[]).forEach(t=>{ o["customers/"+c.id+"#tx."+t.id]=clean(Object.assign({},t,{cid:c.id})); });
  });
  d.sales.forEach(s=>{ o["days/"+s.date+"#s."+s.id]=clean(s); });
  d.capital.forEach(c=>{ o["capital/"+c.id]=clean(c); });
  (d.trash||[]).forEach(t=>{ o["trash/"+t.id]=clean(t); });
  o["meta/settings"]=clean(d.settings);
  o["meta/stock"]=clean({list:d.stock||[],miss:d.miss||[]});
  return o;
}
function normCode(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function fmtCode(id){ return (id||"").replace(/(.{4})/g,"$1-").replace(/-$/,""); }
function genShopId(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r=new Uint8Array(20); crypto.getRandomValues(r); return Array.from(r,x=>A[x%32]).join(""); }

let needRender=false, rt=null;
function softRender(){
  const ae=document.activeElement;
  if($("#modal").innerHTML || (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $("#view").contains(ae))){ needRender=true; return; }
  needRender=false; clearTimeout(rt);
  rt=setTimeout(()=>{ const m=$("main"),y=m.scrollTop; render(); m.scrollTop=y; },120);
}
document.addEventListener("focusout",()=>{ if(needRender) setTimeout(softRender,250); });

function setStatus(st){
  CL.status=st;
  const e=$("#cloudSt"); if(e){ e.textContent = !CL.id?"" : (st==="online"?"☁✓":"☁…"); e.title = st==="online"?"Bulutga ulangan":"Ulanmoqda / oflayn"; }
  const f=$("#cloudStatus"); if(f){ const t=CL.lastSync?" · oxirgi yangilanish: "+new Date(CL.lastSync).toLocaleTimeString("uz",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
    f.innerHTML = st==="online"?'<span class="up">● Ulangan, sinxron</span><span class="mut">'+t+'</span>':'<span class="mut">● Oflayn yoki ulanmoqda</span>'+(CL.lastErr?'<div class="down" style="font-size:12px;margin-top:4px">Xato: '+esc(CL.lastErr)+'</div>':''); }
}
function applyDoc(col,id,data){
  const dk=col+"/"+id; (CL.idx[dk]||[]).forEach(k=>{ delete CL.synced[k]; });
  const keys=[];
  if(data){
    if(col==="customers"){
      const {tx,...base}=data; CL.synced[dk]=base; keys.push(dk);
      Object.keys(tx||{}).forEach(tid=>{ const k=dk+"#tx."+tid; CL.synced[k]=Object.assign({},tx[tid],{cid:id}); keys.push(k); });
    } else if(col==="days"){
      const m=data.s||{}; Object.keys(m).forEach(sid=>{ const k=dk+"#s."+sid; CL.synced[k]=m[sid]; keys.push(k); });
    } else { CL.synced[dk]=data; keys.push(dk); }
  }
  CL.idx[dk]=keys;
}
function dropCol(col){
  const p=col+"/";
  Object.keys(CL.synced).forEach(k=>{ if(k.startsWith(p)) delete CL.synced[k]; });
  Object.keys(CL.idx).forEach(k=>{ if(k.startsWith(p)) delete CL.idx[k]; });
}
function rebuildFromSynced(){
  const S=CL.synced, old=new Map(DB.customers.map(c=>[c.id,c]));
  const custs=[],txBy={},sales=[],cap=[],tr=[]; let st=null, sk=null;
  for(const k in S){
    const v=S[k];
    if(k.startsWith("customers/")){ if(k.indexOf("#tx.")>0){ const {cid,...rest}=v; (txBy[cid]=txBy[cid]||[]).push(rest); } else custs.push(v); }
    else if(k.startsWith("days/")) sales.push(Object.assign({},v));
    else if(k.startsWith("capital/")) cap.push(Object.assign({},v));
    else if(k.startsWith("trash/")) tr.push(Object.assign({},v));
    else if(k==="meta/settings") st=v;
    else if(k==="meta/stock") sk=v;
  }
  DB.customers = custs.map(d=>{
    const c=old.get(d.id)||{tx:[]};
    c.id=d.id; c.name=d.name||""; c.phone=d.phone||""; c.note=d.note||"";
    c.tx=(txBy[d.id]||[]).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1));
    return c;
  }).sort((a,b)=>a.name.localeCompare(b.name));
  DB.sales = sales.sort((a,b)=>(a.ts||0)-(b.ts||0));
  DB.capital = cap.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  DB.trash = tr.sort((a,b)=>b.ts-a.ts);
  if(st) DB.settings = Object.assign({shop:"",margin:20}, st);
  if(sk){ DB.stock=sk.list||[]; DB.miss=sk.miss||[]; }
  CL.lastFlat = flat(DB);
  persistLocal();
}
function onCol(col,snap){
  if(!CL.seen[col]){
    if(snap.metadata.fromCache && snap.empty) return;   // server javobini kutamiz
    dropCol(col); snap.docs.forEach(d=>applyDoc(col,d.id,d.data())); CL.seen[col]=true;
  } else {
    snap.docChanges().forEach(ch=>applyDoc(col,ch.doc.id,ch.type==="removed"?null:ch.doc.data()));
  }
  rebuildFromSynced();
  CL.lastSync=Date.now(); CL.lastErr="";
  if(!snap.metadata.fromCache) setStatus("online"); else setStatus(CL.status);
  softRender();
}
function pushDiff(){
  if(!CL.id || !CL.ready) return;
  const {F,db}=CL.fb, nf=flat(DB), prev=CL.lastFlat, syn=CL.synced, docs={};
  const get=(col,id)=>docs[col+"/"+id]||(docs[col+"/"+id]={col,id,payload:{},del:false});
  const parse=k=>{ const h=k.indexOf("#"), dk=h<0?k:k.slice(0,h), sl=dk.indexOf("/"); return {col:dk.slice(0,sl),id:dk.slice(sl+1),f:h<0?null:k.slice(h+1)}; };
  for(const k in nf){
    if(k in syn && sj(syn[k])===sj(nf[k])) continue;
    const {col,id,f}=parse(k), d=get(col,id);
    if(!f) Object.assign(d.payload,nf[k]);
    else if(f.startsWith("tx.")){ const {cid,...rest}=nf[k]; (d.payload.tx=d.payload.tx||{})[f.slice(3)]=rest; }
    else if(f.startsWith("s.")){ d.payload.date=id; (d.payload.s=d.payload.s||{})[f.slice(2)]=nf[k]; }
    syn[k]=nf[k];
  }
  for(const k in prev){
    if(k in nf) continue;
    const {col,id,f}=parse(k), d=get(col,id);
    if(!f){ if(col==="customers"||col==="capital") d.del=true; }
    else if(f.startsWith("tx.")) (d.payload.tx=d.payload.tx||{})[f.slice(3)]=F.deleteField();
    else if(f.startsWith("s.")){ d.payload.date=id; (d.payload.s=d.payload.s||{})[f.slice(2)]=F.deleteField(); }
    delete syn[k];
  }
  CL.lastFlat=nf;
  const list=Object.values(docs).filter(d=>d.del||Object.keys(d.payload).length);
  for(let i=0;i<list.length;i+=400){
    const b=F.writeBatch(db);
    list.slice(i,i+400).forEach(d=>{ const ref=F.doc(db,"shops",CL.id,d.col,d.id); if(d.del) b.delete(ref); else b.set(ref,d.payload,{merge:true}); });
    b.commit().catch(e=>{ console.warn(e); if(e&&e.code==="permission-denied") toast("Bulutga yozishga ruxsat yo'q"); });
  }
}
function cloudPush(){ try{ pushDiff(); }catch(e){ console.warn(e); } }

async function fbInit(){
  if(!CL.fb){
    const base="https://www.gstatic.com/firebasejs/"+FB_VER+"/";
    const [A,F,U]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
    const app=A.initializeApp(FIREBASE_CONFIG), auth=U.getAuth(app);
    const db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),experimentalAutoDetectLongPolling:true});
    CL.fb={A,F,U,app,auth,db};
  }
  if(!CL.authOk){
    const {U,auth}=CL.fb;
    await new Promise((res,rej)=>{ let off=null, done=false;
      off=U.onAuthStateChanged(auth,async u=>{ if(done) return; done=true; if(off) off(); if(u) return res(); try{ await U.signInAnonymously(auth); res(); }catch(e){ rej(e); } }); });
    CL.authOk=true;
  }
  return CL.fb;
}
async function cloudStart(){
  if(!CL.id || CL.started) return;
  CL.started=true; setStatus("connecting");
  try{
    const {F,db}=await fbInit();
    CL.seen={};
    CL.unsubs=COLS.map(col=>F.onSnapshot(F.collection(db,"shops",CL.id,col),snap=>onCol(col,snap),err=>{
      console.warn(err); CL.lastErr=(err&&(err.code||err.message))||"noma'lum"; setStatus("offline");
      if(err && err.code==="permission-denied") toast("Bulutga ruxsat yo'q (Firestore qoidalarini tekshiring)");
    }));
    CL.ready=true; pushDiff();
  }catch(e){
    console.warn(e); CL.started=false; CL.ready=false; setStatus("offline"); setTimeout(cloudStart,15000);
  }
}
function cloudRestart(){
  CL.unsubs.forEach(u=>{ try{u();}catch(e){} }); CL.unsubs=[]; CL.started=false; CL.ready=false; CL.seen={}; CL.lastErr="";
  toast("Qayta ulanmoqda…"); cloudStart();
}
function cloudStop(){
  CL.unsubs.forEach(u=>{ try{u();}catch(e){} }); CL.unsubs=[]; CL.id=null; CL.ready=false; CL.started=false; CL.seen={};
  try{ localStorage.removeItem(CKEY); localStorage.removeItem(RKEY); }catch(e){} setStatus("off");
}
window.addEventListener("online",()=>{ if(CL.id) cloudStart(); });
window.addEventListener("offline",()=>{ if(CL.id) setStatus("offline"); });

const RKEY="savdo_role_v1", BKEY="savdo_lastbackup_v1", BSNOOZE="savdo_bksnooze_v1", TRASH_DAYS=30;
const isStaffPhone=()=>{ if(!CL.id) return false; try{ return localStorage.getItem(RKEY)==="staff"; }catch(e){ return false; } };
const isOwner=()=> !(DB.settings&&DB.settings.lockStaff&&isStaffPhone());
function setRole(r){ try{ localStorage.setItem(RKEY,r); }catch(e){} }
function toTrash(kind,label,data){ DB.trash.push({id:uid(),kind,label,ts:Date.now(),data:clean(data)}); }
function purgeTrash(){ const lim=Date.now()-TRASH_DAYS*864e5,n=DB.trash.length; DB.trash=DB.trash.filter(t=>t.ts>=lim); if(DB.trash.length!==n) save(); }
const KIND_UZ={customer:"Mijoz",sale:"Savdo",tx:"Qarz yozuvi",capital:"Kapital"};
function restoreTrash(id){
  const t=DB.trash.find(x=>x.id===id); if(!t) return; const d=t.data;
  if(t.kind==="customer"){ if(DB.customers.some(c=>c.id===d.id)){ toast("Bu mijoz allaqachon bor"); return; } DB.customers.push(d); }
  else if(t.kind==="sale"){ DB.sales.push(d.sale); if(d.tx&&d.cid){ const c=DB.customers.find(x=>x.id===d.cid); if(c) c.tx.push(d.tx); } }
  else if(t.kind==="tx"){ const c=DB.customers.find(x=>x.id===d.cid); if(!c){ toast("Avval mijozni savatdan qaytaring"); return; } c.tx.push(d.tx); c.tx.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
  else if(t.kind==="capital"){ DB.capital.push(d); }
  DB.trash=DB.trash.filter(x=>x.id!==id); save(); render(); toast("Qaytarildi ✓"); trashModal();
}
function trashModal(){
  const L=DB.trash.slice().sort((a,b)=>b.ts-a.ts);
  openModal(`<h2>🗑 Savat</h2><div class="mut" style="font-size:13px;margin-bottom:8px">O'chirilganlar ${TRASH_DAYS} kun saqlanadi, keyin butunlay o'chadi.</div>
   ${L.length?`<div class="list">${L.map(t=>`<div class="item"><div><div class="t">${esc(t.label)}</div><div class="s">${KIND_UZ[t.kind]||t.kind} · ${new Date(t.ts).toLocaleDateString("uz")} · ${Math.max(0,TRASH_DAYS-Math.floor((Date.now()-t.ts)/864e5))} kun qoldi</div></div><button class="btn sm" data-r="${t.id}">Qaytarish</button></div>`).join("")}</div>`:'<div class="empty">Savat bo\'sh</div>'}
   <button class="btn sec full" id="x" style="margin-top:12px">Yopish</button>`,
  s=>{ $("#x",s).onclick=closeModal; s.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>restoreTrash(b.dataset.r)); });
}

/* ============ Avto-zaxira (har kuni o'zi, telefon ichida) ============ */
const SNAP_KEEP=7;
async function snapList(){ if(!IDB.db) return []; return new Promise(res=>{ try{ const r=IDB.db.transaction("kv").objectStore("kv").getAllKeys(); r.onsuccess=()=>res(r.result.filter(k=>String(k).startsWith("snap_")).sort().reverse()); r.onerror=()=>res([]); }catch(e){ res([]); } }); }
async function snapDelete(k){ return new Promise(res=>{ try{ const tx=IDB.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=tx.onerror=tx.onabort=()=>res(); }catch(e){ res(); } }); }
async function autoSnap(force){
  if(!IDB.db||!(DB.sales.length||DB.customers.length||DB.capital.length)) return;
  const key="snap_"+today();
  try{
    const L=await snapList();
    if(!force && L.includes(key)) return;
    await idbPut(key,JSON.parse(JSON.stringify(DB)));
    const all=await snapList(); for(const k of all.slice(SNAP_KEEP)) await snapDelete(k);
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") autoSnap(); });
async function snapModal(){
  const L=await snapList();
  openModal(`<h2>🛟 Avto-zaxira</h2><div class="mut" style="font-size:13px;margin-bottom:8px">Ilova har kuni ma'lumotning nusxasini o'zi saqlaydi (oxirgi ${SNAP_KEEP} kun). Biror narsa buzilsa yoki yo'qolsa, kerakli kunni tanlab qaytaring.</div>
   ${L.length?`<div class="list">${L.map(k=>`<div class="item"><div><div class="t">${k.slice(5)}</div></div><button class="btn sm" data-s="${k}">Qaytarish</button></div>`).join("")}</div>`:'<div class="empty">Hali zaxira yo\'q (ertaga paydo bo\'ladi)</div>'}
   <button class="btn sec full" id="x" style="margin-top:12px">Yopish</button>`,
  s=>{ $("#x",s).onclick=closeModal; s.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.s;
    confirmBox("Hozirgi ma'lumot shu kundagi nusxa bilan almashtiriladi (hozirgisi ham zaxiraga olinadi). Davom etasizmi?",async()=>{
      try{ await autoSnap(true); const d=await idbGet(k); if(!d){ toast("Nusxa topilmadi"); return; }

    }); }); });
}

function askAddSale(amount){
  const custOpts = DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  openModal(`
    <h2>Savdoni qo'shish</h2>

    <label>Tannarx (ixtiyoriy) — foyda aniq hisoblanishi uchun</label>

    <div class="mut" style="font-size:12px;margin-top:4px">Bo'sh qoldirsangiz, foyda ${DB.settings.margin||0}% deb olinadi (Sozlamada o'zgartiriladi)</div>
    <label class="chk"><input type="checkbox" id="sDebt"> Nasiyaga (qarz daftariga yozish)</label>
    <div id="debtBox" style="display:none">
      <label>Mijoz</label>
      <select id="sCust">${custOpts}<option value="__new">+ Yangi mijoz…</option></select>
      <input id="sNew" placeholder="Yangi mijoz ismi" style="display:none;margin-top:8px">
    </div>
    ${DB.stock.length?`<label>Ombordan ayirish (ixtiyoriy)</label><div class="row"><select id="sProd" style="flex:2"><option value="">— tanlamang —</option>${DB.stock.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.qty})</option>`).join("")}</select><input id="sQty" inputmode="decimal" value="1" style="flex:1"></div>`:""}
    <label>Izoh (ixtiyoriy)</label><input id="sNote" placeholder="Nima sotildi?">
    <div class="row" style="margin-top:16px"><button class="btn sec" id="no">Bekor</button><button class="btn" id="yes">Qo'shish</button></div>`,
  s=>{
    const dBox=$("#debtBox",s), sel=$("#sCust",s), nw=$("#sNew",s);
    if(!DB.customers.length){ sel.value="__new"; nw.style.display="block"; }
    $("#sDebt",s).onchange=e=>{ dBox.style.display=e.target.checked?"block":"none"; };
    sel.onchange=()=>{ nw.style.display = sel.value==="__new"?"block":"none"; };
    $("#no",s).onclick=closeModal;
    $("#yes",s).onclick=()=>{
      const costRaw=$("#sCost",s).value.trim();
      const sale={id:uid(),date:today(),ts:Date.now(),amount,cost:costRaw===""?null:val($("#sCost",s)),note:$("#sNote",s).value.trim()};
      if($("#sDebt",s).checked){
        let cid=sel.value;
        if(cid==="__new"){
          const nm=nw.value.trim(); if(!nm){ toast("Mijoz ismini yozing"); return; }
          const c={id:uid(),name:nm,phone:"",note:"",tx:[]}; DB.customers.push(c); cid=c.id;
        }
        const c=DB.customers.find(x=>x.id===cid);
        c.tx.push({id:uid(),date:today(),type:"debt",amount,note:sale.note||"Savdo"});
        sale.customerId=cid;
      }
      const pe=$("#sProd",s); if(pe&&pe.value){ const p=DB.stock.find(x=>x.id===pe.value); if(p){ p.qty=Math.max(0,Math.round((p.qty-(val($("#sQty",s))||1))*100)/100); } }
      DB.sales.push(sale); save(); closeModal(); toast("Savdoga qo'shildi ✓");
      render();
    };
  });
}

const AVC=["#0f766e","#b45309","#7c3aed","#0369a1","#be185d","#15803d","#c2410c"];
function avatar(name,sz){ const n=String(name||"?").trim()||"?"; let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))>>>0;
  const ini=n.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return `<div class="av" style="background:${AVC[h%AVC.length]};${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2.6)}px`:""}">${esc(ini)}</div>`; }
function dayTotals(d){ const ts=DB.sales.filter(s=>s.date===d); return {n:ts.length,sum:ts.reduce((a,s)=>a+s.amount,0),pr:ts.reduce((a,s)=>a+saleProfit(s),0)}; }
function totalDebt(){ return DB.customers.reduce((a,c)=>a+Math.max(0,balance(c)),0); }
function reportText(){
  const t=today(), dayStr=n=>ymd(new Date(Date.now()-n*864e5));
  const agg=from=>{ const ss=DB.sales.filter(x=>x.date>=from&&x.date<=t); return {n:ss.length,sum:ss.reduce((a,x)=>a+x.amount,0),pr:ss.reduce((a,x)=>a+saleProfit(x),0)}; };
  const a=agg(t), w=agg(dayStr(6)), m=agg(dayStr(29));
  return `📊 ${DB.settings.shop||"Savdo Hisobi"}: hisobot (${fmtDate(t)})\n\nBugun: savdo ${som(a.sum)}, foyda ${som(a.pr)}, ${a.n} ta savdo\nOxirgi 7 kun: savdo ${som(w.sum)}, foyda ${som(w.pr)}\nOxirgi 30 kun: savdo ${som(m.sum)}, foyda ${som(m.pr)}\nJami qarz: ${som(totalDebt())} (${DB.customers.filter(c=>balance(c)>0).length} ta mijoz)`;
}

  const out=DB.stock.filter(p=>p.qty<=0), low=DB.stock.filter(p=>p.qty>0&&p.qty<=(p.min==null?3:p.min));
  return {out,low};
}
function missTop(){
  const lim=ymd(addDays(new Date(),-30)), m={};
  DB.miss.filter(x=>x.date>=lim).forEach(x=>{ const k=x.name.trim().toLowerCase(); (m[k]=m[k]||{name:x.name.trim(),n:0}).n++; });
  return Object.values(m).sort((a,b)=>b.n-a.n);
}

/* ============ 3) KAPITAL ============ */
function capitalReport(){
  // kunlar bo'yicha: tikilgan, foyda, jamlanma
  const days = {};
  const get = d => days[d] || (days[d]={d,cap:0,profit:0,sales:0});
  DB.capital.forEach(c=>get(c.date).cap+=c.amount);
  DB.sales.forEach(s=>{ const r=get(s.date); r.profit+=saleProfit(s); r.sales+=s.amount; });
  const arr = Object.values(days).sort((a,b)=>a.d<b.d?-1:1);
  let cc=0,cp=0;
  arr.forEach(r=>{ cc+=r.cap; cp+=r.profit; r.cumCap=cc; r.cumProfit=cp; r.net=cp-cc; });
  const totCap=cc, totProfit=cp, net=cp-cc;
  // nolga chiqqan sana: oxirigacha doimiy net>=0 bo'lgan eng birinchi kun
  let be=null;
  if(totCap>0 && net>=0){
    for(let i=arr.length-1;i>=0;i--){ if(arr[i].net>=0 && arr[i].cumCap>0) be=arr[i].d; else break; }
  }
  return {arr,totCap,totProfit,net,be};
}

/* ============ 4) STATISTIKA ============ */
function periodKey(dateStr,p){
  const d=parseD(dateStr);
  if(p==="day") return dateStr;
  if(p==="week"){ const wd=(d.getDay()+6)%7; return ymd(addDays(d,-wd)); }
  return d.getFullYear()+"-"+pad(d.getMonth()+1);
}
function periodList(p){
  const out=[], now=new Date();
  if(p==="day"){ for(let i=13;i>=0;i--) out.push(ymd(addDays(now,-i))); }
  else if(p==="week"){ const wd=(now.getDay()+6)%7; const mon=addDays(now,-wd); for(let i=11;i>=0;i--) out.push(ymd(addDays(mon,-7*i))); }
  else { for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(d.getFullYear()+"-"+pad(d.getMonth()+1)); } }
  return out;
}
function periodLabel(k,p){
  if(p==="day"){ const d=parseD(k); return d.getDate()+" "+MONTHS[d.getMonth()]; }
  if(p==="week"){ const d=parseD(k), e=addDays(d,6); return d.getDate()+"."+pad(d.getMonth()+1)+"–"+e.getDate()+"."+pad(e.getMonth()+1); }
  const [y,m]=k.split("-"); return MONTHS[+m-1]+" "+y;
}
function viewStat(v){
  const keys=periodList(period), agg={};
  keys.forEach(k=>agg[k]={sales:0,profit:0,n:0});
  // oldingi davr ham hisoblansin (birinchi qator uchun)
  const prevKeyOf = k => period==="day"?ymd(addDays(parseD(k),-1)):period==="week"?ymd(addDays(parseD(k),-7)):(()=>{const [y,m]=k.split("-").map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);})();
  const all={};
  DB.sales.forEach(s=>{ const k=periodKey(s.date,period); const r=all[k]||(all[k]={sales:0,profit:0,n:0}); r.sales+=s.amount; r.profit+=saleProfit(s); r.n++; });
  const rows = keys.map(k=>{ const r=all[k]||{sales:0,profit:0,n:0}; const p=all[prevKeyOf(k)]||{sales:0};
    let ch=null; if(p.sales>0) ch=(r.sales-p.sales)/p.sales*100; else if(r.sales>0) ch=Infinity;
    return {k,...r,prev:p.sales,ch}; });
  const cur=rows[rows.length-1], prv=rows[rows.length-2]||{sales:0};
  const chTxt = ch => ch==null?"—":ch===Infinity?"yangi":(ch>0?"▲ +":ch<0?"▼ ":"= ")+Math.abs(ch).toFixed(1)+"%";
  const chCls = ch => ch==null?"mut":(ch>0?"up":ch<0?"down":"mut");
  const names={day:["Bugun","Kecha"],week:["Shu hafta","O'tgan hafta"],month:["Shu oy","O'tgan oy"]}[period];
  const best = rows.reduce((a,r)=>r.sales>a.sales?r:a,rows[0]);
  v.innerHTML = `
  <div class="seg" id="seg">${[["day","Kunlik"],["week","Haftalik"],["month","Oylik"]].map(([k,l])=>`<button data-p="${k}" class="${period===k?"on":""}">${l}</button>`).join("")}</div>
  <div class="grid g4">
    <div class="stat"><div class="l">${names[0]}</div><div class="v">${som(cur.sales)}</div></div>
    <div class="stat"><div class="l">${names[1]}</div><div class="v">${som(prv.sales)}</div></div>
    <div class="stat"><div class="l">O'zgarish</div><div class="v ${chCls(cur.ch)}">${chTxt(cur.ch)}</div></div>
    <div class="stat"><div class="l">${names[0]}gi foyda</div><div class="v up">${som(cur.profit)}</div></div>
  </div>
  <div style="height:12px"></div>
  <div class="card"><h3>Savdo dinamikasi</h3>${chartSvg(rows,period)}</div>
  <div class="card"><h3>Batafsil</h3><div class="scroll"><table>
    <thead><tr><th>Davr</th><th>Savdo</th><th>Foyda</th><th>Soni</th><th>O'zgarish</th></tr></thead>
    <tbody>${rows.slice().reverse().map(r=>`<tr><td>${periodLabel(r.k,period)}</td><td>${num(r.sales)}</td><td class="up">${num(r.profit)}</td><td>${r.n}</td><td class="${chCls(r.ch)}">${chTxt(r.ch)}</td></tr>`).join("")}</tbody></table></div>
    ${best.sales>0?`<div class="mut" style="font-size:12px;margin-top:8px">Eng yaxshi davr: <b>${periodLabel(best.k,period)}</b> — ${som(best.sales)}</div>`:""}</div>`;
  $("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{period=b.dataset.p;render();});
}
function chartSvg(rows,p){
  const W=640,H=190,L=8,B=26,T=10, n=rows.length, max=Math.max(1,...rows.map(r=>r.sales));
  const bw=(W-L*2)/n, ph=H-B-T;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Savdo grafigi">`;
  rows.forEach((r,i)=>{
    const h=Math.max(r.sales>0?2:0,r.sales/max*ph), x=L+i*bw+bw*.18, w=bw*.64, y=T+ph-h;
    const col = r.ch==null||r.ch===Infinity||r.ch>=0 ? "var(--pri)" : "var(--down)";
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${col}"><title>${periodLabel(r.k,p)}: ${som(r.sales)}</title></rect>`;
    if(n<=14 || i%2===(n-1)%2) s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="${n>12?10:11}" fill="var(--mut)">${p==="week"?periodLabel(r.k,p).split("–")[0]:periodLabel(r.k,p).replace(/ \d{4}$/,"")}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-L}" y1="${T+ph}" y2="${T+ph}" stroke="var(--line)"/></svg>`;
  return s;
}

  else if(deferredPrompt){ ib.style.display="block"; ib.onclick=async()=>{ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; ib.style.display="none"; }; }
  $("#sv").onclick=()=>{ DB.settings.shop=$("#shop").value.trim(); DB.settings.margin=Math.max(0,Math.min(100,val($("#mg")))); save(); render(); toast("Saqlandi ✓"); };
  $("#bk").onclick=()=>openModal(`<h2>Zaxira matni</h2><div class="mut" style="font-size:13px">Hammasini belgilab nusxa oling va xavfsiz joyga (Telegram «Saved messages») saqlang.</div><textarea id="bt" rows="8" readonly style="margin-top:10px">${esc(JSON.stringify(DB))}</textarea><div class="row" style="margin-top:12px"><button class="btn sec" id="x">Yopish</button><button class="btn" id="cp">Nusxa olish</button></div>`,
    s=>{ $("#x",s).onclick=closeModal; $("#cp",s).onclick=async()=>{ const t=$("#bt",s); t.select(); try{ await navigator.clipboard.writeText(t.value);}catch(e){ document.execCommand("copy"); } markBackup(); toast("Nusxa olindi ✓"); }; });
  $("#fl").onclick=()=>{ const b=new Blob([JSON.stringify(DB)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="savdo-zaxira-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); markBackup(); toast("Fayl yuklandi"); };
  const restore = txt => { try{ const o=JSON.parse(txt); if(!o||!Array.isArray(o.sales)) throw 0; confirmBox("Hozirgi ma'lumotlar zaxiradagi bilan almashtirilsinmi?",()=>{ load(o); persistLocal(true); cloudPush(); render(); toast("Tiklandi ✓"); }); }catch(e){ toast("Zaxira noto'g'ri"); } };
  $("#rb").onclick=()=>restore($("#rs").value);
  $("#rf").onclick=()=>$("#file").click();
  $("#file").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restore(r.result); r.readAsText(f); };
  if($("#wipe")) $("#wipe").onclick=()=>confirmBox("HAMMA ma'lumot o'chadi. Davom etasizmi?",()=>{ load(null); persistLocal(true); render(); });
}

/* ============ Ishga tushirish ============ */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; if(tab==="set") render(); });
boot();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
